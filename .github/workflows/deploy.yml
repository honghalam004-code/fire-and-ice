name: Build C++ Game and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: 3. Build Raylib for Web
        run: |
          source ./emsdk/emsdk_env.sh
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib/src
          emcc -c rcore.c rshapes.c rtextures.c rtext.c rmodels.c raudio.c -Os -Wall -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2
          emar rcs libraylib.a *.o

      - name: 4. Compile C++ Game to WebAssembly
        run: |
          source ./emsdk/emsdk_env.sh
          mkdir -p public
          em++ main.cpp -o public/index.html -Os -Wall \
            -I./raylib/src ./raylib/src/libraylib.a \
            -s USE_GLFW=3 -s ASYNCIFY -s INITIAL_MEMORY=67108864 \
            --shell-file shell.html \
            -DPLATFORM_WEB

      - name: 5. Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 6. Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 7. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
